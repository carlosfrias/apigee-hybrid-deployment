---
- name:  Install Apigee hybrid on AWS EKS cluster
  hosts:  localhost
  connection: local

  vars_files:
  - ~/.apigee-secure/credentials.yml
  - aws-vars.yml

  collections:
  - bap_coe.bootstrap_runtime

  roles:
  - { role: "terraform_installer" }
  - { role: "terraform_init" }
  - { role: "terraform_plan" }
  - { role: "terraform_apply" }
