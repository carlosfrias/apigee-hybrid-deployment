---
- name: Refresh workspace
  import_playbook: "{{ playbook_dir }}/apigee-hybrid-workspace-refresh.yml"

- name: Build and push to artifact repository
  hosts: localhost
  connection: local

  vars:
    PROJECT_ID: "friasc-apigee-lab"
    repoName: "apigee-workspace"
    tag: "v1.0"
    repoFormat: "docker"
    repoLocation: "us-east1"
    repoDockerProto: "{{repoLocation}}-docker.pkg.dev"
    dockerBuildName: "apigee-workspace"
    WORK_DIR: "work_dir"
    APIGEE_WORKBENCH_NAME: "apigee-hybrid-workspace"
    APIGEE_HYBRID_INSTALLER_GITHUB: "https://github.com/carlosfrias/{{ APIGEE_WORKBENCH_NAME }}.git"
    APIGEE_HYBRID_INSTALLER_SOURCE_FOLDER: "bap_coe/apigee_helm/playbooks/molecule"
    APIGEE_HYBRID_INSTALLER_MOLECULE_SOURCE: "{{ WORK_DIR }}/source-repos/{{ APIGEE_WORKBENCH_NAME }}/{{ APIGEE_HYBRID_INSTALLER_SOURCE_FOLDER }}"
    APIGEE_HYBRID_INSTALLER_MOLECULE_DEST: "{{ playbook_dir }}"
    APIGEE_HYBRID_ON_AWS_NAME: "apigee-hybrid-on-aws"
    APIGEE_HYBRID_ON_AWS_GITHUB: "https://github.com/AyoSal/{{ APIGEE_HYBRID_ON_AWS_NAME }}"
    APIGEE_HYBRID_ON_AWS_SOURCE_FOLDER: "{{ APIGEE_HYBRID_ON_AWS_NAME }}"
    GITHUB_REPOS:
    - { repo: "{{ APIGEE_HYBRID_INSTALLER_GITHUB }}", dest: "{{ playbook_dir | dirname }}/work_dir/source-repos/{{ APIGEE_WORKBENCH_NAME }}" }
    - { repo: "{{ APIGEE_HYBRID_ON_AWS_GITHUB }}", dest: "{{ playbook_dir | dirname }}/work_dir/source-repos/{{ APIGEE_HYBRID_ON_AWS_NAME }}" }
    - { repo: "https://github.com/ganadurai/single-node-apigee-hybrid-install.git", dest: "{{ playbook_dir | dirname }}/work_dir/source-repos/single-node-apigee-hybrid-install"}

  collections:
  - commmunity.docker

  tasks:
    - name: Set image name
      set_fact:
        image_name: "{{ repoLocation }}.pkg.dev/{{ PROJECT_ID }}/{{ repoName }}/{{ dockerBuildName }}"

    - name: Build image
      docker_image:
        name: "{{dockerBuildName}}"
        source: "build"
        build:
          path: "{{ playbook_dir | dirname }}"
          rm: true
          dockerfile: "Dockerfile"

    - name: Tag image
      community.docker.docker_image_tag:
        name: "{{dockerBuildName}}"
        repository:
        - "{{ image_name}}:{{ tag }}"
          
    - name: Create container
      docker_container:
        name: "{{image_name}}"
        image: "{{image_name}}"
        state: "started"
        auto_remove: yes
        detach: yes
        volumes:
        - "{{ ansible_user_dir }}/.apigee-secure:/root/apigee-secure:ro"
        - "{{ ansible_user_dir }}/.config:/root/.config/gcloud:ro"
        - "{{ playbook_dir }}/resources:/apigee-workspace/apigee-helm/resources:ro"
        - "{{ playbook_dir }}/molecule:/apigee-workspace/apigee-helm/molecule:rw"
        - "{{ playbook_dir }}/work_dir:/apigee-workspace/apigee-helm/work_dir:rw"
#        recreate: true

    - name: Configure Docker Authentication
      shell: |
        gcloud auth configure-docker {{repoLocation}}-docker.pkg.dev --project {{PROJECT_ID}}

    - name: Create repository
      ignore_errors: true
      shell: |
        gcloud artifacts repositories create {{repoName}} \
            --repository-format={{repoFormat}} \
            --location={{repoLocation}} \
            --description="Docker repository" \
            --project={{PROJECT_ID}}

#    - name: List repositories
#      shell: |
#        gcloud artifacts repositories list --project {{ PROJECT_ID }}
#      failed_when: repoName not in output.stdout

    - name: Push container to repo
      shell: |
       docker push {{ image_name }}:{{ tag }}
        
    - name: Generate start-container.sh script
      template:
        src: "{{ playbook_dir }}/start-container.sh.template"
        dest: ../start-container.sh
        mode: 0777

