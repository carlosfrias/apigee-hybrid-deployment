---
- name: Generate start
  import_playbook: apigee-hybrid-workspace-build-generate-start.yml

- name: Refresh build files
  import_playbook: apigee-hybrid-workspace-build-refresh.yml

- name: Build container
  hosts: localhost
  connection: local

  vars_files:
  - apigee-hybrid-workspace-build-variables.yml

  collections:
      - commmunity.docker

  tasks:
    - name: Build image
      docker_image:
        name: "{{ artifact_image_name }}"
        source: "build"
        build:
          path: "{{ SOURCE_DIR }}"
          rm: true
          dockerfile: "Dockerfile"

    - name: Create container
      docker_container:
        name: "{{ container_name }}"
        image: "{{ artifact_image_name }}"
        state: "started"
        auto_remove: yes
        detach: yes
        volumes: "{{ container_volumes }}"
        recreate: true

    - name: Tag image
      community.docker.docker_image_tag:
        name: "{{ artifact_image_name }}"
        repository:
        - "{{ artifact_image_name }}:{{ tag }}"
        - "{{ gcr_io_image_name }}:{{ tag }}"

