---
tag: "v1.0"

SOURCE_DIR: "{{ playbook_dir | dirname | dirname }}"
WORK_DIR: "{{ SOURCE_DIR }}/work_dir"

CONTAINER_NAME_SELECTED: 0
CONTAINER_NAMES:
- "apigee-workspace"
- "apigee-cloudshell-workspace"
container_name: "{{ CONTAINER_NAMES[CONTAINER_NAME_SELECTED] }}"

BOOTSTRAP_IMAGE_SELECTED: 1
BOOTSTRAP_IMAGES:
- "python:3.11.2"
- "gcr.io/cloudshell-images/cloudshell:latest"
bootstrap_image: "{{ BOOTSTRAP_IMAGES[BOOTSTRAP_IMAGE_SELECTED] }}"

artifact_repo_format: "docker"
artifact_project_id: "friasc-apigee-lab"
artifact_repo_name: "apigee-workspace"
artifact_repo_location: "us-east1"
artifact_docker_protocol: "{{ artifact_repo_location }}-docker.pkg.dev"
artifact_image_name: "{{ artifact_docker_protocol }}/{{ artifact_project_id }}/{{ artifact_repo_name }}/{{ container_name }}"

#local_artifact_name: "{{ container_name }}"

gcr_io_project_id: "cloudshell-images"
gcr_io_protocol: "gcr.io"
gcr_io_image_name: "{{ gcr_io_protocol }}/{{ artifact_project_id }}/{{ container_name }}"

APIGEE_HYBRID_WORKBENCH_NAME: "apigee-hybrid-workspace"
APIGEE_HYBRID_INSTALLER_GITHUB: "https://github.com/carlosfrias/{{ APIGEE_HYBRID_WORKBENCH_NAME }}.git"
APIGEE_HYBRID_INSTALLER_SOURCE_FOLDER: "bap_coe/apigee_helm/playbooks/molecule"
APIGEE_HYBRID_INSTALLER_MOLECULE_SOURCE: "{{ WORK_DIR }}/source-repos/{{ APIGEE_HYBRID_WORKBENCH_NAME }}/{{ APIGEE_HYBRID_INSTALLER_SOURCE_FOLDER }}"
APIGEE_HYBRID_INSTALLER_MOLECULE_DEST: "{{ SOURCE_DIR }}"
APIGEE_HYBRID_ON_AWS_NAME: "apigee-hybrid-on-aws"
APIGEE_HYBRID_ON_AWS_GITHUB: "https://github.com/AyoSal/{{ APIGEE_HYBRID_ON_AWS_NAME }}"
APIGEE_HYBRID_ON_AWS_SOURCE_FOLDER: "{{ APIGEE_HYBRID_ON_AWS_NAME }}"
GITHUB_REPOS:
- { repo: "{{ APIGEE_HYBRID_INSTALLER_GITHUB }}", dest: "{{ WORK_DIR }}/source-repos/{{ APIGEE_HYBRID_WORKBENCH_NAME }}" }
- { repo: "{{ APIGEE_HYBRID_ON_AWS_GITHUB }}", dest: "{{ WORK_DIR }}/source-repos/{{ APIGEE_HYBRID_ON_AWS_NAME }}" }
#- { repo: "https://github.com/ganadurai/single-node-apigee-hybrid-install.git", dest: "{{ WORK_DIR }}/source-repos/single-node-apigee-hybrid-install"}

templates:
- { src: "{{ SOURCE_DIR }}/utils/bootstrap/start-container-template.sh", dest: "{{ SOURCE_DIR }}/start-container.sh" }
- { src: "{{ SOURCE_DIR }}/utils/bootstrap/Dockerfile.template", dest: "{{ SOURCE_DIR }}/Dockerfile" }
- { src: "{{ SOURCE_DIR }}/utils/bootstrap/README-template.md", dest: "{{ SOURCE_DIR }}/README.md" }

container_volumes:
- "{{ ansible_user_dir }}/.apigee-secure:/root/apigee-secure:ro"
- "{{ ansible_user_dir }}/.config:/root/.config/gcloud:ro"
- "{{ SOURCE_DIR }}/resources:/apigee-workspace/apigee-helm/resources:ro"
- "{{ SOURCE_DIR }}/molecule:/apigee-workspace/apigee-helm/molecule:rw"
- "{{ SOURCE_DIR }}/work_dir:/apigee-workspace/apigee-helm/work_dir:rw"

OUTPUT_FOLDERS:
- "{{ WORK_DIR }}"
- "{{ SOURCE_DIR }}/molecule"

OUTPUT_FILES:
- "{{ SOURCE_DIR }}/start-container.sh"
- "{{ SOURCE_DIR }}/Dockerfile"
- "{{ SOURCE_DIR }}/README.md"
- "{{ SOURCE_DIR }}/terraform.log"

SYSTEM_PACKAGES:
- make
- build-essential
- libssl-dev
- zlib1g-dev
- libbz2-dev
- libreadline-dev
- libsqlite3-dev
- wget
- curl
- llvm
- libncurses5-dev
- libncursesw5-dev
- xz-utils
- tk-dev
- libffi-dev
- liblzma-dev
- git
- software-properties-common
- curl
- git
- mc
- vim
- facter
- aptitude
- apt-utils
- apt-transport-https
- ca-certificates
- gnupg
- python3-pip
- libssl-dev
- libffi-dev
- rsync
