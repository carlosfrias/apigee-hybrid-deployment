---
- name:  Install awscli binary
  hosts:  localhost
  connection: local

  vars_files:
  - ~/.apigee-secure/credentials.yml
  - "{{ playbook_dir | dirname | dirname }}/aws-vars.yml"

  collections:
  - bap_coe.bootstrap_runtime

  tasks:
    - name: Install awscli binary
      pip:
        name: "{{ item}}"
        state: present
      with_items:
        - "awscli"
        - "boto"
        - "s3transfer"

    - name: Configure awscli access
      shell: |
        aws configure set aws_access_key_id "{{ AWS_ACCESS_KEY }}"
        aws configure set aws_secret_access_key "{{ AWS_ACCESS_KEY_SECRET }}"
        aws configure set region "{{ REGION }}"
        aws configure set output "{{ AWSCLI_OUTPUT_FORMAT }}"
        

