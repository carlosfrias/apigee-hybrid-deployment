# eksctl get cluster --name hybrid-eks-Xiir3jHa -o yaml
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: hybrid-eks-Xiir3jHa
  region: us-east-1

managedNodeGroups:
- name: apigee-data # Replace with your actual Apigee data nodepool name
  instanceType: <instance-type> # e.g., m5.xlarge
  desiredCapacity: 1
  # ... other existing configurations for apigee-data
  taints:
    - key: "node.cilium.io/agent-not-ready"
      value: "true"
      effect: "NoExecute"

- name: apigee-runtime #