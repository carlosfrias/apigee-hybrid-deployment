---
- name: Assert and refresh local build workspace
  hosts: localhost
  connection: local

  vars_files:
  - apigee-hybrid-workspace-build-variables.yml

  tasks:
    - name: Assert working folders
      file:
        path: "{{ item }}"
        state: directory
      with_items: "{{ OUTPUT_FOLDERS }}"

    - name: Download apigee-hybrid-deployment scripts
      git:
        repo: "{{ item.repo }}"
        dest: "{{ item.dest }}"

      with_items: "{{ GITHUB_REPOS }}"

    - name: Synchronize from local molecule folder to build folder
      ansible.posix.synchronize:
        src: "{{ APIGEE_HYBRID_INSTALLER_MOLECULE_SOURCE }}"
        dest: "{{ APIGEE_HYBRID_INSTALLER_MOLECULE_DEST }}"
        perms: false

        times: true

    - name: Update folder ownership
      file:
        path: "{{ item }}"
      with_items: ["{{ OUTPUT_FOLDERS }}", "{{ APIGEE_HYBRID_INSTALLER_MOLECULE_DEST }}"]
