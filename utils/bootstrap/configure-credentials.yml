---
- name: Configure security credentials
  hosts: localhost
  connection: local

  vars_files:
  - "{{ playbook_dir | dirname | dirname }}/utils/build/apigee-hybrid-workspace-build-variables.yml"

  vars_prompt:
    - name: org_id
      prompt: What is your argolis organization id?
    - name: google_ldap
      prompt: What is your google ldap?
    - name: billing_id
      prompt: What is your argolis billing id?
    - name: argolis_admin_name
      prompt: What is your argolis admin account name?
      default: "admin"

  tasks:
  - name: Place configured credentials file in .apigee-secure folder
    template:
      src: "{{ SOURCE_DIR }}/resources/credentials.yml.template"
      dest: "{{ CREDENTIALS_DIR }}/credentials-test.yml"